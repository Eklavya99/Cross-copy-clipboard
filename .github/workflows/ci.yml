name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release -p crossclip
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: crossclip-${{ runner.os }}
          path: |
            target/release/crossclip
            target/release/crossclip.exe
          if-no-files-found: error

  gnome-extension:
    name: GNOME extension
    runs-on: ubuntu-latest
    env:
      EXT_DIR: gnome-extension/crossclip@eklavya99.github.io
    steps:
      - uses: actions/checkout@v4
      - name: Install glib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin
      - name: Compile settings schema
        run: glib-compile-schemas --strict "$EXT_DIR/schemas"
      - name: Pack extension
        run: cd "$EXT_DIR" && zip -r "$GITHUB_WORKSPACE/crossclip@eklavya99.github.io.shell-extension.zip" .
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: crossclip-gnome-extension
          path: crossclip@eklavya99.github.io.shell-extension.zip
          if-no-files-found: error
